name: ZERO Dolphin Universal v0.7 — On-demand ARM64

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'APK to build'
        type: choice
        options: [optimized, baseline, both]
        default: optimized
        required: true
      request_id:
        description: 'Unique on-demand request ID from Termux'
        type: string
        default: manual
        required: false

run-name: "ZERO Dolphin ${{ inputs.variant }} ${{ inputs.request_id }}"

permissions:
  contents: read

jobs:
  android:
    name: Build universal-${{ matrix.variant }} arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'both' && '["baseline","optimized"]' || format('["{0}"]', inputs.variant)) }}
    env:
      DOLPHIN_REVISION: 8d2ad1a662472955497e5bb79d7b9ec6999e1f0d
    steps:
      - name: Check out ZERO build kit
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, NDK, and CMake
        run: |
          sdkmanager --install 'platforms;android-37' 'build-tools;37.0.0' 'ndk;30.0.15729638' 'cmake;3.31.0'
          yes | sdkmanager --licenses > /dev/null || true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent Android signing identity
        env:
          ZERO_KEYSTORE_B64: ${{ secrets.ZERO_KEYSTORE_B64 }}
          ZERO_STOREPASS: ${{ secrets.ZERO_STOREPASS }}
        run: |
          set -euo pipefail
          if [[ -z "$ZERO_KEYSTORE_B64" || -z "$ZERO_STOREPASS" ]]; then
            echo '::error::Missing ZERO_KEYSTORE_B64 or ZERO_STOREPASS. Run zero-dolphin signing in Termux.'
            exit 1
          fi
          printf '%s' "$ZERO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zero-signing.p12"
          chmod 600 "$RUNNER_TEMP/zero-signing.p12"
          echo "ZERO_SIGNING_STORE_FILE=$RUNNER_TEMP/zero-signing.p12" >> "$GITHUB_ENV"

