        run: |
          python3 - <<'PY_RESTORE_ZERO'
          import os,base64,tarfile,io
          raw=base64.b64decode(os.environ['ZERO_KIT_B64'],validate=False)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              for member in archive.getmembers():
                  if not member.isfile() or member.name.startswith('/') or '..' in member.name.split('/'):
                      raise RuntimeError('Unsafe archive member')
                  archive.extract(member, path='.',filter='data')
          print('Restored ZERO source patch kit')
          PY_RESTORE_ZERO

      - name: Run lossless-transform and build-recipe tests
        run: python3 -m unittest discover -s tests -v

      - name: Clone pinned Dolphin with submodules
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/dolphin-emu/dolphin.git dolphin
          git -C dolphin checkout --detach "$DOLPHIN_REVISION"
          git -C dolphin submodule update --init --recursive --depth 1

      - name: Apply profiler and ${{ matrix.variant }} graphics branch
        run: |
          python3 scripts/prepare_build.py --source dolphin --variant '${{ matrix.variant }}'
          git -C dolphin diff --check

      - name: Build Android arm64 debug APK
        working-directory: dolphin/Source/Android
        env:
          ZERO_SIGNING_STORE_PASSWORD: ${{ secrets.ZERO_STOREPASS }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify signed APK and record provenance
        run: |
          set -euo pipefail
          APK='dolphin/Source/Android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p output
          unzip -Z1 "$APK" > output/APK_FILE_LIST.txt
          grep -q '^lib/arm64-v8a/' output/APK_FILE_LIST.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" | tee output/SIGNATURE_INFO.txt
          cp "$APK" "output/ZERO-Dolphin-v07-${{ matrix.variant }}-arm64.apk"
          (cd output && sha256sum *.apk > SHA256SUMS.txt)
          printf 'Dolphin upstream: %s\nVariant: %s\nOn-demand Termux update; stable signing; CPU/Vulkan/EFB/Shader diagnostics; lossless EFB/Vulkan optimizations if optimized\n' \
            "$DOLPHIN_REVISION" '${{ matrix.variant }}' > output/BUILD_INFO.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Dolphin-v07-${{ matrix.variant }}-Android-arm64-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
